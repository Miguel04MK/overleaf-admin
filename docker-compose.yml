# =============================================================
# Docker Compose para la plataforma overleaf-admin
#
# Servicios:
#   - db     : PostgreSQL 16 con volumen persistente.
#   - app    : Flask + gunicorn, conecta a `db` y a Overleaf MongoDB externo.
#   - pgadmin: (opcional, perfil "tools") gestor visual de Postgres.
#
# MongoDB de Overleaf NO se incluye: la app se conecta a la instancia ya
# existente del overleaf-toolkit a traves de `host.docker.internal:27017`
# (configurable con la variable MONGO_URI del .env).
# =============================================================

services:
  # --- PostgreSQL: base de datos propia de la plataforma ---
  db:
    image: postgres:16-alpine
    container_name: overleaf_admin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overleaf_admin}
      POSTGRES_USER: ${POSTGRES_USER:-overleaf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overleaf_admin_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-overleaf_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Aplicacion Flask + gunicorn ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overleaf_admin_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro del contenedor el host de Postgres es `db`, no `localhost`.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-overleaf_admin}:${POSTGRES_PASSWORD:-overleaf_admin_pass}@db:5432/${POSTGRES_DB:-overleaf_admin}
      # Zona horaria del contenedor: afecta a `datetime.astimezone()` en los
      # templates para mostrar las horas locales (UTC se sigue guardando en BD).
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${APP_PORT:-8000}:8000"
    # `host.docker.internal` apunta al host. En Linux puro hay que añadir
    # host-gateway; en Windows/Mac/WSL2 Docker Desktop ya lo resuelve.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- pgAdmin (opcional, para explorar la BD visualmente) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: overleaf_admin_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools  # Activar con: docker compose --profile tools up

volumes:
  pgdata:
    name: overleaf_admin_pgdata
