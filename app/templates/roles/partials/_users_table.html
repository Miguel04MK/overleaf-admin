      <div class="card border-0 shadow-sm flex-fill d-flex flex-column">

        <div class="card-header bg-white border-bottom py-2 px-4 flex-shrink-0
                    d-flex align-items-center justify-content-between">
          <h6 class="fw-semibold mb-0 small">
            <i class="bi bi-people me-2 text-muted"></i>Usuarios con este rol
            <span class="badge bg-secondary ms-1">{{ users_stats | length }}</span>
          </h6>
          <div class="d-flex align-items-center gap-2">
            <span id="sim-table-badge"
                  class="badge bg-warning-subtle text-warning-emphasis
                         border border-warning-subtle badge-pulse d-none"
                  style="font-size:.65rem;">
              <i class="bi bi-eye me-1"></i>Vista previa
            </span>
            <button type="button" class="btn btn-sm btn-ol"
                    data-bs-toggle="modal" data-bs-target="#manageUsersModal">
              <i class="bi bi-people me-1"></i>Administrar
            </button>
          </div>
        </div>

        {% if users_stats %}
        <div class="users-scroll flex-grow-1">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small" id="users-table">
              <thead class="table-light sticky-top" style="top:0;">
                <tr>
                  <th class="ps-3 sortable" data-sort="name" style="width:35%;">
                    Usuario
                    <i class="bi bi-arrow-down-up sort-icon ms-1" style="font-size:.68rem; opacity:.4;"></i>
                  </th>
                  <th class="sortable" data-sort="quota">
                    Cuota usada
                    <i class="bi bi-arrow-down-up sort-icon ms-1" style="font-size:.68rem; opacity:.4;"></i>
                  </th>
                  <th class="text-center sortable" data-sort="projects">
                    Proyectos
                    <i class="bi bi-arrow-down-up sort-icon ms-1" style="font-size:.68rem; opacity:.4;"></i>
                  </th>
                  <th class="text-end pe-3" style="width:48px;"></th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
        </div>

        <div id="users-pagination"
             class="d-flex align-items-center justify-content-between px-3 py-2
                    border-top flex-shrink-0 d-none">
        </div>

        {% else %}
        <div class="d-flex flex-grow-1 align-items-center justify-content-center
                    text-center text-muted py-5 small">
          <div>
            <i class="bi bi-people fs-3 d-block mb-2 opacity-50"></i>
            Ningún usuario tiene este rol asignado actualmente.
          </div>
        </div>
        {% endif %}

      </div>
