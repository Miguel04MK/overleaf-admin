  {# ── Bulk bar (oculta hasta que se selecciona algo) ──────────────────────── #}
  <div id="bulk-bar" class="mb-3 d-none">
    <span class="bulk-count"><span id="bulk-count-num">0</span> seleccionada(s)</span>
    <button class="btn btn-sm btn-outline-secondary" id="btn-bulk-read" title="Marcar como leídas">
      <i class="bi bi-envelope-open me-1"></i>Marcar leídas
    </button>
    <button class="btn btn-sm btn-outline-success" id="btn-bulk-resolve" title="Resolver seleccionadas">
      <i class="bi bi-check-lg me-1"></i>Resolver
    </button>
    <button class="btn btn-sm btn-outline-warning" id="btn-bulk-reopen" title="Reabrir seleccionadas">
      <i class="bi bi-arrow-counterclockwise me-1"></i>Reabrir
    </button>
    <button class="btn btn-sm btn-link text-secondary p-0 ms-auto text-decoration-none" id="btn-deselect-all">
      <i class="bi bi-x-circle me-1"></i>Deseleccionar todo
    </button>
  </div>
