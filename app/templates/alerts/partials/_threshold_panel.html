  {# ── Panel de configuración de umbrales (oculto por defecto) ────────────── #}
  <div id="threshold-panel" class="card border-0 shadow-sm mb-3 d-none"
       style="border-top: 3px solid #3d8b3d !important;">
    <div class="card-body py-3 px-4">

      <div class="d-flex align-items-center gap-2 mb-3">
        <div class="rounded-2 p-1 bg-success-subtle flex-shrink-0">
          <i class="bi bi-sliders text-success" style="font-size:1rem;"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-semibold">Umbrales de detección</h6>
          <p class="mb-0 text-muted" style="font-size:.73rem;">
            Ajusta cuándo se generan alertas automáticas. Los cambios surten efecto en el próximo recálculo.
          </p>
        </div>
        <button id="btn-close-config" class="btn btn-sm btn-outline-secondary ms-auto">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div id="threshold-fields" class="d-flex flex-wrap gap-2 mb-3">
        <div class="text-muted small p-2">
          <span class="spinner-border spinner-border-sm me-1"></span>Cargando…
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 pt-1 border-top">
        <button id="btn-save-thresholds" class="btn btn-sm btn-ol">
          <i class="bi bi-floppy me-1"></i>Guardar cambios
        </button>
        <span id="threshold-msg" class="small ms-1 d-none"></span>
        <span class="text-muted small ms-auto d-none d-md-inline">
          <i class="bi bi-info-circle me-1"></i>Los valores se expresan en % u horas según el campo.
        </span>
      </div>

    </div>
  </div>
