{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}
{% block page_title %}Error 500{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-exclamation-triangle fs-1 text-danger opacity-75 d-block mb-3"></i>
  <h2 class="fw-bold">500 — Error interno del servidor</h2>
  <p class="text-muted">Algo ha salido mal. Revisa los logs de la aplicación para más detalles.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-success mt-2">
    <i class="bi bi-house me-2"></i>Volver al dashboard
  </a>
</div>
{% endblock %}
